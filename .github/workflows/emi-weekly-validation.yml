name: EMI Weekly Validation

on:
  schedule:
    - cron: '0 14 * * 5'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  weekly-emi-validation:
    name: Run weekly EMI KPI and validation checks
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: 'npm'

      - name: Validate required secrets
        env:
          EMI_SMOKE_TOKEN: ${{ secrets.EMI_SMOKE_TOKEN }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          if [ -z "$EMI_SMOKE_TOKEN" ]; then
            echo "Missing required secret: EMI_SMOKE_TOKEN"
            exit 1
          fi
          if [ -z "$SLACK_WEBHOOK_URL" ]; then
            echo "Missing required secret: SLACK_WEBHOOK_URL"
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Run EMI weekly validation gate
        id: emi
        env:
          EMI_SMOKE_BASE_URL: https://startingmonday.app
          EMI_SMOKE_TOKEN: ${{ secrets.EMI_SMOKE_TOKEN }}
          EMI_SMOKE_OUTPUT_JSON: '1'
        run: |
          node scripts/emi-postdeploy-smoke.mjs --json > emi-weekly-validation.json

      - name: Publish weekly summary
        if: always()
        run: |
          if [ -f emi-weekly-validation.json ]; then
            node scripts/emi-summary-markdown.mjs emi-weekly-validation.json "EMI Weekly Validation" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No validation artifact produced" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload EMI weekly artifact
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: emi-weekly-validation
          path: emi-weekly-validation.json
          retention-days: 30

      - name: Alert on weekly EMI validation failure
        if: failure()
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          curl -X POST -H 'Content-type: application/json' --data "{
            \"text\": \"🚨 EMI weekly validation failed\",
            \"blocks\": [
              {
                \"type\": \"header\",
                \"text\": { \"type\": \"plain_text\", \"text\": \"🚨 EMI weekly validation failed\" }
              },
              {
                \"type\": \"section\",
                \"text\": {
                  \"type\": \"mrkdwn\",
                  \"text\": \"EMI KPI pipeline health check failed (job error, missing snapshots, or a KPI query failure). Business-metric shortfalls are advisory and do not trigger this alert. <${RUN_URL}|View workflow run>.\"
                }
              }
            ]
          }" "$SLACK_WEBHOOK_URL"
