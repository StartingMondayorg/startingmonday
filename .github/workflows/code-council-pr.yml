# Advisory code council report on pull requests.
#
# The council scores the whole repository. That makes it a poor merge gate — a
# PR touching one file inherits every finding in the codebase — but a useful
# review signal once it reports only the delta the branch is responsible for.
#
# Nothing here blocks. Do not add this workflow to the required status checks;
# repo-wide enforcement lives in the weekly unified audit.
name: Code Council (PR)

on:
  pull_request:
    branches: [main]

concurrency:
  group: code-council-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  council-delta:
    name: Code council delta
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          # Need the base commit as well as the merge result.
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      # The audit imports only node: builtins, so it needs no npm install and
      # runs in well under a second. Both halves of the comparison use the audit
      # as it exists on this branch, so a PR that edits the audit itself still
      # compares like with like.
      - name: Audit PR head
        run: |
          cp scripts/code-synthetic-council-audit.mjs "$RUNNER_TEMP/audit.mjs"
          cp scripts/council-pr-report.mjs "$RUNNER_TEMP/report.mjs"
          node "$RUNNER_TEMP/audit.mjs" > /dev/null
          cp docs/code-synthetic-council-audit.latest.json "$RUNNER_TEMP/head.json"

      - name: Audit base branch
        run: |
          git checkout -f --detach "${{ github.event.pull_request.base.sha }}"
          node "$RUNNER_TEMP/audit.mjs" > /dev/null
          cp docs/code-synthetic-council-audit.latest.json "$RUNNER_TEMP/base.json"

      - name: Render delta
        run: |
          node "$RUNNER_TEMP/report.mjs" \
            "$RUNNER_TEMP/base.json" \
            "$RUNNER_TEMP/head.json" \
            --out "$RUNNER_TEMP/council.md"
          cat "$RUNNER_TEMP/council.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Post or update PR comment
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs')
            const marker = '<!-- code-council-delta -->'
            const body = marker + '\n' + fs.readFileSync(process.env.RUNNER_TEMP + '/council.md', 'utf8')

            const { owner, repo } = context.repo
            const issue_number = context.payload.pull_request.number

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner, repo, issue_number, per_page: 100,
            })
            const existing = comments.find(
              (c) => c.user?.type === 'Bot' && c.body?.includes(marker)
            )

            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body })
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body })
            }
