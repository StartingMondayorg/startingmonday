name: OWASP ZAP Baseline

on:
  schedule:
    - cron: '0 7 1 * *'
  workflow_dispatch:
    inputs:
      target_url:
        description: Staging URL to scan
        required: false
        default: ''

permissions:
  contents: read

jobs:
  zap-baseline:
    name: ZAP baseline against staging
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Resolve target URL
        id: target
        env:
          INPUT_URL: ${{ inputs.target_url }}
          STAGING_URL: ${{ secrets.ZAP_STAGING_URL }}
        run: |
          target="${INPUT_URL:-${STAGING_URL:-}}"
          if [ -z "$target" ]; then
            echo 'ZAP_STAGING_URL secret or workflow target_url input is required.'
            exit 1
          fi
          echo "url=$target" >> "$GITHUB_OUTPUT"

      - name: Run OWASP ZAP baseline scan
        uses: zaproxy/action-baseline@v0.15.0
        with:
          target: ${{ steps.target.outputs.url }}
          allow_issue_writing: false
          fail_action: true
          cmd_options: '-a'

      - name: Upload ZAP reports
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: zap-baseline-report
          path: |
            report_html.html
            report_md.md
            report_json.json
          if-no-files-found: warn
          retention-days: 90
