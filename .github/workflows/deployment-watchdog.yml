name: Deployment Watchdog

on:
  push:
    branches: [production]
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  verify-pushed-sha:
    name: Verify pushed SHA reaches production
    if: github.event_name == 'push' && github.ref == 'refs/heads/production'
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Validate monitoring secret
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          if [ -z "$SLACK_WEBHOOK_URL" ]; then
            echo "Missing required secret: SLACK_WEBHOOK_URL"
            exit 1
          fi

      - name: Wait for customer-domain deploy marker
        id: parity
        uses: actions/github-script@v8
        env:
          TARGET_SHA: ${{ github.sha }}
          MAX_ATTEMPTS: "20"
          SLEEP_SECONDS: "60"
        with:
          script: |
            const sha = process.env.TARGET_SHA
            const maxAttempts = Number(process.env.MAX_ATTEMPTS || '20')
            const sleepSeconds = Number(process.env.SLEEP_SECONDS || '60')
            const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms))
            const normalizeSha = (value) => String(value ?? '').trim().toLowerCase()
            const shaMatches = (expected, actual) =>
              expected === actual || expected.startsWith(actual) || actual.startsWith(expected)
            let lastState = 'marker:unavailable'

            for (let attempt = 1; attempt <= maxAttempts; attempt += 1) {
              try {
                const response = await fetch('https://startingmonday.app/api/deploy-marker', {
                  headers: { 'cache-control': 'no-cache' },
                })
                const payload = response.ok ? await response.json() : null
                const observedSha = normalizeSha(payload?.deploy_sha)
                lastState = response.ok ? `marker:${observedSha || 'missing'}` : `marker:http-${response.status}`

                if (payload?.kind === 'deploy-marker' && shaMatches(normalizeSha(sha), observedSha)) {
                  core.setOutput('result', 'success')
                  core.setOutput('states', lastState)
                  core.setOutput('sha', sha)
                  core.notice(`Customer-domain parity passed for ${sha.slice(0, 8)} with ${lastState}`)
                  return
                }
              } catch (error) {
                lastState = `marker:error-${error instanceof Error ? error.message : 'unknown'}`
              }

              core.notice(`Attempt ${attempt}/${maxAttempts}: ${sha.slice(0, 8)} not live; state=${lastState}`)
              if (attempt < maxAttempts) {
                await sleep(sleepSeconds * 1000)
              }
            }

            core.setOutput('result', 'timeout')
            core.setOutput('states', lastState)
            core.setOutput('sha', sha)
            core.warning(`Customer-domain parity timed out for ${sha.slice(0, 8)}; latest state: ${lastState}`)

      - name: Alert when pushed SHA did not reach production
        if: steps.parity.outputs.result == 'timeout'
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          SHA="${{ steps.parity.outputs.sha || github.sha }}"
          STATES="${{ steps.parity.outputs.states || 'none' }}"
          RESULT="${{ steps.parity.outputs.result || 'failed' }}"
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          RUNBOOK_URL="${{ github.server_url }}/${{ github.repository }}/blob/main/docs/sre/runbooks/deployment-stalled.md"

          curl -X POST -H 'Content-type: application/json' --data "{
            \"text\": \"Pushed SHA did not reach production\",
            \"blocks\": [
              {
                \"type\": \"header\",
                \"text\": { \"type\": \"plain_text\", \"text\": \"Pushed SHA did not reach production\" }
              },
              {
                \"type\": \"section\",
                \"fields\": [
                  {\"type\": \"mrkdwn\", \"text\": \"*SHA:* <${{ github.server_url }}/${{ github.repository }}/commit/${SHA}|${SHA:0:8}>\"},
                  {\"type\": \"mrkdwn\", \"text\": \"*Result:* ${RESULT}\"},
                  {\"type\": \"mrkdwn\", \"text\": \"*State:* ${STATES}\"},
                  {\"type\": \"mrkdwn\", \"text\": \"*Branch:* ${{ github.ref_name }}\"}
                ]
              },
              {
                \"type\": \"section\",
                \"text\": {\"type\": \"mrkdwn\", \"text\": \"<${RUN_URL}|View parity run> | <${RUNBOOK_URL}|Runbook: deployment stalled>\"}
              }
            ]
          }" "$SLACK_WEBHOOK_URL"

  watchdog:
    name: Watch latest production deployment
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Validate monitoring secret
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          if [ -z "$SLACK_WEBHOOK_URL" ]; then
            echo "Missing required secret: SLACK_WEBHOOK_URL"
            exit 1
          fi

      - name: Check whether the latest production commit is live
        id: watchdog
        uses: actions/github-script@v8
        with:
          script: |
            const owner = context.repo.owner
            const repo = context.repo.repo
            const branch = 'production'
            const thresholdMinutes = 30
            const runbookUrl = `https://github.com/${owner}/${repo}/blob/main/docs/sre/runbooks/deployment-stalled.md`

            const branchRes = await github.rest.repos.getBranch({ owner, repo, branch })
            const sha = branchRes.data.commit.sha
            const committedAt = new Date(
              branchRes.data.commit.commit.committer?.date ||
              branchRes.data.commit.commit.author?.date
            )
            const ageMinutes = Math.floor((Date.now() - committedAt.getTime()) / 60000)
            let state = 'marker:unavailable'
            let hasSuccess = false

            try {
              const response = await fetch('https://startingmonday.app/api/deploy-marker', {
                headers: { 'cache-control': 'no-cache' },
              })
              const payload = response.ok ? await response.json() : null
              const observedSha = String(payload?.deploy_sha ?? '').trim().toLowerCase()
              state = response.ok ? `marker:${observedSha || 'missing'}` : `marker:http-${response.status}`
              hasSuccess = payload?.kind === 'deploy-marker' && observedSha === sha.toLowerCase()
            } catch (error) {
              state = `marker:error-${error instanceof Error ? error.message : 'unknown'}`
            }

            const shouldAlert = ageMinutes >= thresholdMinutes && !hasSuccess

            core.setOutput('should_alert', shouldAlert ? 'true' : 'false')
            core.setOutput('sha', sha)
            core.setOutput('age_minutes', String(ageMinutes))
            core.setOutput('states', state)
            core.setOutput('runbook_url', runbookUrl)
            core.notice(`Deployment watchdog: sha=${sha.slice(0, 8)} age=${ageMinutes}m state=${state} success=${hasSuccess}`)

      - name: Alert when latest production commit has not deployed
        if: steps.watchdog.outputs.should_alert == 'true'
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          SHA="${{ steps.watchdog.outputs.sha }}"
          AGE="${{ steps.watchdog.outputs.age_minutes }}"
          STATES="${{ steps.watchdog.outputs.states }}"
          RUNBOOK_URL="${{ steps.watchdog.outputs.runbook_url }}"
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

          curl -X POST -H 'Content-type: application/json' --data "{
            \"text\": \"Deployment has not completed\",
            \"blocks\": [
              {
                \"type\": \"header\",
                \"text\": { \"type\": \"plain_text\", \"text\": \"Deployment has not completed\" }
              },
              {
                \"type\": \"section\",
                \"fields\": [
                  {\"type\": \"mrkdwn\", \"text\": \"*Latest production SHA:* <${{ github.server_url }}/${{ github.repository }}/commit/${SHA}|${SHA:0:8}>\"},
                  {\"type\": \"mrkdwn\", \"text\": \"*Age:* ${AGE} minutes\"},
                  {\"type\": \"mrkdwn\", \"text\": \"*State:* ${STATES:-none found}\"},
                  {\"type\": \"mrkdwn\", \"text\": \"*Repository:* ${{ github.repository }}\"}
                ]
              },
              {
                \"type\": \"section\",
                \"text\": {\"type\": \"mrkdwn\", \"text\": \"<${RUNBOOK_URL}|Runbook: deployment stalled> | <${RUN_URL}|View watchdog run>\"}
              }
            ]
          }" "$SLACK_WEBHOOK_URL"
