name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  merge_group:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ux-ui-rubric-contract:
    name: ux-ui-rubric-contract
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/staging' || github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate monitoring coverage matrix and harness
        run: npm run monitor:coverage:refresh

      - name: Upload monitoring coverage artifacts
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: monitoring-coverage-matrix
          path: |
            docs/status/monitoring-coverage-matrix.latest.json
            docs/status/monitoring-coverage-matrix.latest.md
            tests/e2e/generated/
          retention-days: 14

      - name: Run UX/UI rubric page contract
        run: npm run ux:rubric:pages

  luxury-static-public-all:
    name: Luxury static gate (public-all)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/staging' || github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v5

      - name: Detect luxury/static scope changes
        if: github.event_name == 'pull_request'
        id: scope
        uses: dorny/paths-filter@v3
        with:
          filters: |
            public_shared_ui:
              - 'src/app/(marketing)/**'
              - 'src/app/components/**'
              - 'src/app/globals.css'
              - 'src/app/layout.tsx'
              - 'src/app/page.tsx'
              - 'src/app/optimize/**'
              - 'src/components/ui/**'
              - 'src/lib/starting-monday-hero-content.ts'
              - 'src/lib/channel-metrics-events.ts'
              - 'public/**'
              - 'tests/e2e/luxury-public-all-pages.spec.ts'
              - 'tests/e2e/__screenshots__/**'

      - uses: actions/setup-node@v5
        if: github.event_name != 'pull_request' || steps.scope.outputs.public_shared_ui == 'true'
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        if: github.event_name != 'pull_request' || steps.scope.outputs.public_shared_ui == 'true'
        run: npm ci

      - name: Run luxury static gate at public-all enforcement tier
        if: github.event_name != 'pull_request' || steps.scope.outputs.public_shared_ui == 'true'
        run: npm run ux:luxury:static:public-all

      - name: Skip luxury static gate (no relevant public/shared UI changes)
        if: github.event_name == 'pull_request' && steps.scope.outputs.public_shared_ui != 'true'
        run: 'echo "Skipping luxury static gate for PR: no relevant public/shared UI paths changed."'

  predeploy-gates:
    name: Predeploy gates (lint, typecheck, build, smoke)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      pull-requests: read

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Detect scoped content changes
        id: scoped
        uses: dorny/paths-filter@v3
        with:
          filters: |
            guides:
              - 'docs/**'
              - 'scripts/user-guide-sync.ts'
              - 'scripts/internal-guide-sync.ts'
              - 'scripts/eval-guide-retrieval.ts'
            outreach:
              - 'src/lib/outreach/**'
              - 'scripts/*outreach*'
              - 'docs/outreach/**'

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'

      - name: Verify protected shadcn dependency approval
        id: shadcn-approval
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v8
        with:
          script: |
            const fs = require('fs')
            const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'))
            const correctlyClassified = Boolean(pkg.dependencies?.shadcn) && !pkg.devDependencies?.shadcn
            if (correctlyClassified) {
              core.info('shadcn remains in production dependencies')
              return
            }

            const reviews = await github.paginate(github.rest.pulls.listReviews, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number,
              per_page: 100,
            })
            const headSha = context.payload.pull_request.head.sha
            const approvedReview = reviews.some((review) =>
              review.user?.login === 'richrothschild'
              && review.state === 'APPROVED'
              && review.commit_id === headSha
            )
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              per_page: 100,
            })
            const approvalToken = `/approve-shadcn-change ${headSha}`
            const approvedComment = comments.some((comment) =>
              comment.user?.login === 'richrothschild'
              && comment.body?.trim() === approvalToken
            )
            if (!approvedReview && !approvedComment) {
              core.setFailed(`Removing or reclassifying shadcn requires a current-head approval from richrothschild: approve the review or comment "${approvalToken}".`)
              return
            }
            core.setOutput('approved_by', 'richrothschild')

      - name: Dependency policy check
        env:
          SHADCN_CHANGE_APPROVED_BY: ${{ steps.shadcn-approval.outputs.approved_by }}
        run: npm run deps:check

      - name: Documentation command check
        run: npm run docs:check-commands

      - name: Signal-engine master-plan pin guard
        run: npm run guard:signal-engine-plan

      - name: Dashboard simplification gate
        run: npm run guard:dashboard-simplification && npm run test:dashboard-simplification-gate

      - name: Landing page change approval guard
        env:
          ALLOW_LANDING_PAGE_CHANGE: >-
            ${{ (contains(github.event.pull_request.labels.*.name, 'allow-landing-page-change') || vars.ALLOW_LANDING_PAGE_CHANGE == 'true') && 'true' || 'false' }}
          LANDING_GUARD_BASE_REF: ${{ github.event.pull_request.base.sha || '' }}
        run: npm run guard:landing-page-approval

      - name: Release UX checklist policy check
        run: npm run release:ux:checklist:check

      - name: Marketing trust/proof placement gate
        run: npm run marketing:trust-proof:gate

      - name: Lighthouse budget config gate
        run: npm run perf:lighthouse:budget:config

      - name: Install dependencies
        run: npm ci

      - name: Billing readiness gate (strict)
        if: github.ref == 'refs/heads/main'
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
          NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY }}
          STRIPE_PRICE_MONITOR: ${{ secrets.STRIPE_PRICE_MONITOR }}
          STRIPE_PRICE_MONITOR_ANNUAL: ${{ secrets.STRIPE_PRICE_MONITOR_ANNUAL }}
          STRIPE_PRICE_ACTIVE: ${{ secrets.STRIPE_PRICE_ACTIVE }}
          STRIPE_PRICE_ACTIVE_ANNUAL: ${{ secrets.STRIPE_PRICE_ACTIVE_ANNUAL }}
          STRIPE_PRICE_EXECUTIVE: ${{ secrets.STRIPE_PRICE_EXECUTIVE }}
          STRIPE_PRICE_EXECUTIVE_ANNUAL: ${{ secrets.STRIPE_PRICE_EXECUTIVE_ANNUAL }}
          STRIPE_PRICE_PARTNER_PASSIVE: ${{ secrets.STRIPE_PRICE_PARTNER_PASSIVE }}
          STRIPE_PRICE_PARTNER_ACTIVE: ${{ secrets.STRIPE_PRICE_PARTNER_ACTIVE }}
        run: npm run billing:readiness:strict

      - name: Generate guide artifacts
        run: npm run guide:user:sync && npm run guide:internal:sync

      - name: Guide retrieval evaluation (strict)
        if: github.event_name != 'pull_request' || steps.scoped.outputs.guides == 'true'
        run: npm run guide:retrieval:eval:strict

      - name: Lint
        run: npm run lint

      - name: Lint baseline regression check
        run: npm run lint:check-baseline

      - name: Type check
        run: npm run typecheck

      - name: Migration rollback readiness check
        run: npm run migration:rollback:check:strict

      - name: Code council audit (advisory on staging and PR)
        if: github.ref != 'refs/heads/main'
        run: npm run audit:code-council

      - name: Code council strict audit (main only)
        if: github.ref == 'refs/heads/main'
        run: npm run audit:code-council:strict

      - name: Build
        env:
          MOBILE_ELITE_GATE_STRICT: ${{ (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/staging') && '1' || '0' }}
          PLAYWRIGHT_BASE_URL: ${{ github.ref == 'refs/heads/main' && secrets.PLAYWRIGHT_BASE_URL || 'https://starting-monday-staging.up.railway.app' }}
        run: npm run build

      - name: Outreach format check
        if: github.event_name != 'pull_request' || steps.scoped.outputs.outreach == 'true'
        run: node scripts/check-outreach-format.mjs

      - name: Executive fit criteria check
        run: node scripts/check-executive-fit-criteria.mjs

      - name: Start app for smoke checks
        uses: ./.github/actions/start-local-app

      - name: Smoke checks
        env:
          MONITOR_BASE_URL: http://127.0.0.1:3000
          MONITOR_OUTPUT_JSON: '1'
        run: npm run monitor:smoke:json

      - name: Stop app
        if: always()
        uses: ./.github/actions/stop-local-app

      - name: Run tests
        run: npm test

      - name: Run unit tests with coverage
        if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/staging'
        run: npm run test:coverage

      - name: Coverage folder thresholds gate
        if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/staging'
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha || '' }}
        run: |
          if [ -n "$PR_BASE_SHA" ]; then
            BASE_REF="$PR_BASE_SHA"
          else
            BASE_REF="$(git rev-parse HEAD~1)"
          fi
          npm run coverage:folders:check -- --base-ref="$BASE_REF" --head-ref="${GITHUB_SHA}"

      - name: Diff coverage gate
        if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/staging'
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha || '' }}
        run: |
          if [ -n "$PR_BASE_SHA" ]; then
            BASE_REF="$PR_BASE_SHA"
          else
            BASE_REF="$(git rev-parse HEAD~1)"
          fi
          npm run coverage:diff:check -- --base-ref="$BASE_REF" --head-ref="${GITHUB_SHA}" --min-coverage=90

      # Em-dash check moved to ESLint (no-restricted-syntax in eslint.config.mjs)
      # so violations surface in-editor instead of at CI time.

  mobile-ux-contract-and-banned-patterns:
    name: Mobile UX contract and banned patterns
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run mobile UX contract and banned patterns guard
        run: npm run mobile:guard

  risky-change-rollout-policy:
    name: Risky change rollout policy
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'

    steps:
      - uses: actions/checkout@v5

      - name: Detect risky file changes
        id: changed
        uses: dorny/paths-filter@v3
        with:
          filters: |
            risky:
              - 'src/app/[(]auth[)]/**'
              - 'src/app/auth/**'
              - 'src/app/(marketing)/for-coaches/**'
              - 'src/app/(marketing)/pricing/**'
              - 'src/app/(marketing)/demo/**'
              - '.github/workflows/ci.yml'
            rollout_policy:
              - 'config/feature-rollout-policy.json'
              - 'docs/engineering/pr-churn-reduction-policy.md'

      - name: Check feature-flag-first label on risky changes (advisory)
        if: steps.changed.outputs.risky == 'true' && github.head_ref != 'staging'
        uses: actions/github-script@v8
        env:
          ROLLOUT_POLICY_CHANGED: ${{ steps.changed.outputs.rollout_policy }}
        with:
          script: |
            const labels = (context.payload.pull_request?.labels || []).map((l) => l.name)
            const hasFeatureFlagLabel = labels.includes('feature-flagged')
            const rolloutPolicyChanged = process.env.ROLLOUT_POLICY_CHANGED === 'true'

            if (!hasFeatureFlagLabel && !rolloutPolicyChanged) {
              core.warning('Risky PR advisory: add feature-flagged label or update config/feature-rollout-policy.json for rollout traceability.')
            } else {
              core.info('Risky PR advisory: rollout policy check satisfied.')
            }

  # Single shared wait for the Railway deploy of this commit, consumed by
  # every job below that tests the live staging/main deployment. Previously
  # each of those jobs polled scripts/wait-for-deployed-commit.sh
  # independently against the same URL — 4x redundant polling and 4
  # independent timeout/flake surfaces for what is fundamentally one fact
  # ("is this commit live yet?"). Only runs on the pushes that actually
  # trigger a deploy; PR runs test a local build instead and don't need it,
  # so this job is intentionally skipped there (see `if:` on the jobs below
  # for how they treat a skipped dependency as "no wait needed").
  deploy-ready:
    name: Wait for deployment of this commit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: github.ref == 'refs/heads/staging' || github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v5

      - name: Wait for deployment of this commit
        run: bash scripts/wait-for-deployed-commit.sh
        env:
          BASE_URL: ${{ github.ref == 'refs/heads/staging' && 'https://starting-monday-staging.up.railway.app' || secrets.PLAYWRIGHT_BASE_URL }}
          EXPECTED_SHA: ${{ github.sha }}

  playwright:
    name: Playwright E2E
    runs-on: ubuntu-latest
    container: mcr.microsoft.com/playwright:v1.62.1-noble
    timeout-minutes: 30
    needs: [deploy-ready]
    if: (needs.deploy-ready.result == 'success' || needs.deploy-ready.result == 'skipped') && (github.ref == 'refs/heads/staging' || github.ref == 'refs/heads/main')
    env:
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run E2E tests
        run: npm run test:e2e
        env:
          PLAYWRIGHT_BASE_URL: ${{ github.ref == 'refs/heads/staging' && 'https://starting-monday-staging.up.railway.app' || secrets.PLAYWRIGHT_BASE_URL }}
          PLAYWRIGHT_TEST_EMAIL: ${{ secrets.PLAYWRIGHT_TEST_EMAIL }}
          PLAYWRIGHT_TEST_PASSWORD: ${{ secrets.PLAYWRIGHT_TEST_PASSWORD }}
          PLAYWRIGHT_SYNTH_SIGNUP_EMAIL: ${{ secrets.PLAYWRIGHT_SYNTH_SIGNUP_EMAIL }}
          PLAYWRIGHT_SYNTH_SIGNUP_PASSWORD: ${{ secrets.PLAYWRIGHT_SYNTH_SIGNUP_PASSWORD }}

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  playwright-merge-queue-full:
    name: Playwright merge-queue full suite
    runs-on: ubuntu-latest
    container: mcr.microsoft.com/playwright:v1.62.1-noble
    timeout-minutes: 45
    if: github.event_name == 'merge_group'
    env:
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run merge-queue expanded Playwright suites
        run: npx playwright test --project=setup --project=smoke --project=monitor-generated --project=synthetics
        env:
          PLAYWRIGHT_BASE_URL: https://starting-monday-staging.up.railway.app
          PLAYWRIGHT_TEST_EMAIL: ${{ secrets.PLAYWRIGHT_TEST_EMAIL }}
          PLAYWRIGHT_TEST_PASSWORD: ${{ secrets.PLAYWRIGHT_TEST_PASSWORD }}
          PLAYWRIGHT_SYNTH_SIGNUP_EMAIL: ${{ secrets.PLAYWRIGHT_SYNTH_SIGNUP_EMAIL }}
          PLAYWRIGHT_SYNTH_SIGNUP_PASSWORD: ${{ secrets.PLAYWRIGHT_SYNTH_SIGNUP_PASSWORD }}

      - name: Upload merge-queue Playwright report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: playwright-merge-queue-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  playwright-pr-plan:
    name: Playwright PR plan
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      playwright_base_url: ${{ steps.base_url.outputs.playwright_base_url }}

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Detect changed files
        id: changed
        uses: dorny/paths-filter@v3
        with:
          filters: |
            authux:
              - 'src/app/(auth)/**'
              - 'tests/e2e/auth-ux.spec.ts'
            luxuryux:
              - 'src/app/(marketing)/for-coaches/**'
              - 'tests/e2e/luxury-ux.spec.ts'
            synthetic10:
              - 'tests/e2e/synthetics.spec.ts'
              - 'src/app/(auth)/signup/**'
              - 'src/app/partners/**'
            landinghero:
              - 'src/app/(marketing)/page.tsx'
              - 'src/app/(marketing)/example/**'
              - 'src/app/components/LandingPage.tsx'
              - 'src/app/components/SignalTimelineCard.tsx'
              - 'src/components/ui/button.tsx'
              - 'src/lib/starting-monday-hero-content.ts'
              - 'src/lib/feature-flags.ts'
              - 'tests/e2e/landing-hero.spec.ts'
              - 'tests/e2e/accessibility-tier0.spec.ts'
              - 'tests/e2e/__screenshots__/landing-hero-*.png'
            full:
              - '.github/workflows/ci.yml'
              - 'playwright.config.ts'
              - 'tests/e2e/global-setup.ts'
              - 'package.json'
              - 'package-lock.json'
              - 'tests/e2e/generated/**'

      - name: Resolve Playwright base URL
        id: base_url
        shell: bash
        run: |
          if [ "${{ github.head_ref }}" = "staging" ] || [ "${{ github.ref }}" = "refs/heads/staging" ]; then
            echo "playwright_base_url=https://starting-monday-staging.up.railway.app" >> "$GITHUB_OUTPUT"
          else
            resolved_base_url="${{ secrets.PLAYWRIGHT_BASE_URL }}"
            if [ -z "$resolved_base_url" ]; then
              resolved_base_url="https://starting-monday-staging.up.railway.app"
            fi
            echo "playwright_base_url=$resolved_base_url" >> "$GITHUB_OUTPUT"
          fi

      - name: Build changed-files matrix
        id: plan
        shell: bash
        env:
          AUTH_CHANGED: ${{ steps.changed.outputs.authux }}
          LUXURY_CHANGED: ${{ steps.changed.outputs.luxuryux }}
          SYNTHETIC_CHANGED: ${{ steps.changed.outputs.synthetic10 }}
          LANDING_HERO_CHANGED: ${{ steps.changed.outputs.landinghero }}
          FULL_CHANGED: ${{ steps.changed.outputs.full }}
        run: |
          node <<'NODE' >> "$GITHUB_OUTPUT"
          const suites = []
          const full = process.env.FULL_CHANGED === 'true'
          const auth = process.env.AUTH_CHANGED === 'true'
          const luxury = process.env.LUXURY_CHANGED === 'true'
          const synthetic = process.env.SYNTHETIC_CHANGED === 'true'
          const landingHero = process.env.LANDING_HERO_CHANGED === 'true'

          // local: true  => render-only suite, runs against the PR's own build
          // local: false => needs a real backend (auth/signup), runs against staging
          if (full) {
            suites.push({
              name: 'smoke-core',
              command: 'npx playwright test tests/e2e/smoke.spec.ts --project=setup --project=smoke',
              local: false,
            })
            suites.push({
              name: 'landing-hero',
              command: 'npx playwright test tests/e2e/landing-hero.spec.ts --project=landing-hero',
              local: true,
              hero_evidence: true,
            })
          } else {
            if (auth) suites.push({ name: 'auth-ux', command: 'npm run test:e2e:auth-ux', local: true })
            if (luxury) suites.push({ name: 'luxury-ux', command: 'npm run test:e2e:luxury', local: true })
            if (landingHero) {
              suites.push({
                name: 'landing-hero',
                command: 'npx playwright test tests/e2e/landing-hero.spec.ts --project=landing-hero',
                local: true,
                hero_evidence: true,
              })
            }
            if (synthetic) {
              suites.push({
                name: 'synthetic-10',
                command: 'npx playwright test tests/e2e/synthetics.spec.ts --project=synthetics --grep "Synthetic-10"',
                local: false,
              })
            }
          }

          if (suites.length === 0) {
            suites.push({ name: 'focused-default', command: 'npm run test:e2e:auth-ux && npm run test:e2e:luxury', local: true })
          }

          process.stdout.write('matrix=' + JSON.stringify(suites) + '\n')
          NODE

  playwright-pr:
    name: Playwright E2E (PR)
    runs-on: ubuntu-latest
    container: mcr.microsoft.com/playwright:v1.62.1-noble
    timeout-minutes: 30
    if: github.event_name == 'pull_request'
    needs: [playwright-pr-plan]
    env:
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.playwright-pr-plan.outputs.matrix) }}

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Render-only suites run against the PR's own build so failures reflect
      # this change, not the current state of the staging deployment.
      - name: Generate guide artifacts (local suites)
        if: matrix.local
        run: npm run guide:user:sync && npm run guide:internal:sync

      - name: Build PR branch for local E2E
        if: matrix.local
        env:
          MOBILE_ELITE_GATE_STRICT: '0'
          NEXT_PUBLIC_SM_HERO_EVIDENCE_ENABLED: ${{ matrix.hero_evidence && '1' || '0' }}
        run: npm run build

      - name: Start app for local E2E
        if: matrix.local
        uses: ./.github/actions/start-local-app
        env:
          NEXT_PUBLIC_SM_HERO_EVIDENCE_ENABLED: ${{ matrix.hero_evidence && '1' || '0' }}

      - name: Run E2E tests (${{ matrix.name }})
        run: ${{ matrix.command }}
        env:
          NEXT_PUBLIC_SM_HERO_EVIDENCE_ENABLED: ${{ matrix.hero_evidence && '1' || '0' }}
          PLAYWRIGHT_BASE_URL: ${{ matrix.local && 'http://127.0.0.1:3000' || needs.playwright-pr-plan.outputs.playwright_base_url }}
          PLAYWRIGHT_TEST_EMAIL: ${{ secrets.PLAYWRIGHT_TEST_EMAIL }}
          PLAYWRIGHT_TEST_PASSWORD: ${{ secrets.PLAYWRIGHT_TEST_PASSWORD }}
          PLAYWRIGHT_SYNTH_SIGNUP_EMAIL: ${{ secrets.PLAYWRIGHT_SYNTH_SIGNUP_EMAIL }}
          PLAYWRIGHT_SYNTH_SIGNUP_PASSWORD: ${{ secrets.PLAYWRIGHT_SYNTH_SIGNUP_PASSWORD }}

      - name: Stop local app
        if: always() && matrix.local
        uses: ./.github/actions/stop-local-app

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: playwright-report-pr-${{ matrix.name }}
          path: playwright-report/
          retention-days: 7

  first-value-synthetic-gate:
    name: First-value synthetic gate
    runs-on: ubuntu-latest
    container: mcr.microsoft.com/playwright:v1.62.1-noble
    timeout-minutes: 20
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/staging' || github.ref == 'refs/heads/main'
    env:
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Validate synthetic gate credentials
        env:
          PLAYWRIGHT_SYNTH_SIGNUP_EMAIL: ${{ secrets.PLAYWRIGHT_SYNTH_SIGNUP_EMAIL }}
          PLAYWRIGHT_SYNTH_SIGNUP_PASSWORD: ${{ secrets.PLAYWRIGHT_SYNTH_SIGNUP_PASSWORD }}
        run: |
          if [ -n "$PLAYWRIGHT_SYNTH_SIGNUP_EMAIL" ] && [ -n "$PLAYWRIGHT_SYNTH_SIGNUP_PASSWORD" ]; then
            echo "Using dedicated signup synthetic credentials"
            exit 0
          fi
          echo "Missing dedicated Playwright signup credentials for first-value gate"
          exit 1

      - name: Run signup-to-first-value synthetic (blocking)
        run: npx playwright test tests/e2e/synthetics.spec.ts --project=synthetics --grep "Synthetic-10"
        env:
          PLAYWRIGHT_BASE_URL: ${{ ((github.event_name == 'pull_request' && github.head_ref == 'staging') || github.ref == 'refs/heads/staging') && 'https://starting-monday-staging.up.railway.app' || secrets.PLAYWRIGHT_BASE_URL }}
          PLAYWRIGHT_SYNTH_SIGNUP_EMAIL: ${{ secrets.PLAYWRIGHT_SYNTH_SIGNUP_EMAIL }}
          PLAYWRIGHT_SYNTH_SIGNUP_PASSWORD: ${{ secrets.PLAYWRIGHT_SYNTH_SIGNUP_PASSWORD }}

      - name: Upload first-value synthetic artifacts
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: first-value-synthetic-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  mobile-visual-smoke:
    name: Mobile visual smoke
    runs-on: ubuntu-latest
    container: mcr.microsoft.com/playwright:v1.62.1-noble
    # Push runs wait on the shared deploy-ready job before screenshotting,
    # so the budget covers wait + tests.
    timeout-minutes: 30
    needs: [deploy-ready]
    if: (needs.deploy-ready.result == 'success' || needs.deploy-ready.result == 'skipped') && (github.event_name == 'pull_request' || github.ref == 'refs/heads/staging' || github.ref == 'refs/heads/main')
    env:
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright

    steps:
      - uses: actions/checkout@v5

      - name: Detect mobile visual scope changes
        if: github.event_name == 'pull_request'
        id: scope
        uses: dorny/paths-filter@v3
        with:
          filters: |
            public_shared_ui:
              - 'src/app/(marketing)/**'
              - 'src/app/components/**'
              - 'src/app/globals.css'
              - 'src/app/layout.tsx'
              - 'src/app/page.tsx'
              - 'src/components/ui/**'
              - 'src/lib/starting-monday-hero-content.ts'
              - 'public/**'
              - 'tests/e2e/mobile-visual-smoke.spec.ts'
              - 'tests/e2e/__screenshots__/smoke-*.png'
              - 'playwright.config.ts'

      - uses: actions/setup-node@v5
        if: github.event_name != 'pull_request' || steps.scope.outputs.public_shared_ui == 'true'
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        if: github.event_name != 'pull_request' || steps.scope.outputs.public_shared_ui == 'true'
        run: npm ci

      # On PRs, test the PR's own build (not the deployed staging site) so the
      # check reflects this change, not whatever staging happens to be serving.
      - name: Generate guide artifacts (PR local run)
        if: github.event_name == 'pull_request' && steps.scope.outputs.public_shared_ui == 'true'
        run: npm run guide:user:sync && npm run guide:internal:sync

      - name: Build PR branch for local E2E
        if: github.event_name == 'pull_request' && steps.scope.outputs.public_shared_ui == 'true'
        env:
          MOBILE_ELITE_GATE_STRICT: '0'
        run: npm run build

      - name: Start app for local E2E
        if: github.event_name == 'pull_request' && steps.scope.outputs.public_shared_ui == 'true'
        uses: ./.github/actions/start-local-app

      - name: Run mobile visual smoke snapshots
        if: github.event_name != 'pull_request' || steps.scope.outputs.public_shared_ui == 'true'
        run: npm run test:e2e:mobile-visual:smoke
        env:
          PLAYWRIGHT_BASE_URL: ${{ github.event_name == 'pull_request' && 'http://127.0.0.1:3000' || (github.ref == 'refs/heads/main' && secrets.PLAYWRIGHT_BASE_URL || 'https://starting-monday-staging.up.railway.app') }}
          PLAYWRIGHT_TEST_EMAIL: ${{ secrets.PLAYWRIGHT_TEST_EMAIL }}
          PLAYWRIGHT_TEST_PASSWORD: ${{ secrets.PLAYWRIGHT_TEST_PASSWORD }}

      - name: Stop local app
        if: always() && github.event_name == 'pull_request' && steps.scope.outputs.public_shared_ui == 'true'
        uses: ./.github/actions/stop-local-app

      - name: Upload mobile visual smoke artifacts
        if: always() && (github.event_name != 'pull_request' || steps.scope.outputs.public_shared_ui == 'true')
        uses: actions/upload-artifact@v6
        with:
          name: mobile-visual-smoke-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

      - name: Skip mobile visual smoke (no relevant public/shared UI changes)
        if: github.event_name == 'pull_request' && steps.scope.outputs.public_shared_ui != 'true'
        run: 'echo "Skipping mobile visual smoke for PR: no relevant public/shared UI paths changed."'

  # mobile-visual-regression job removed: it ran with continue-on-error (could
  # never fail) which is CI theater. Real visual regression should use a
  # reviewable-diff tool (Chromatic/Argos) - see docs/engineering notes.

  auth-ux-guard:
    name: Auth UX guard
    runs-on: ubuntu-latest
    container: mcr.microsoft.com/playwright:v1.62.1-noble
    # Push runs wait on the shared deploy-ready job before screenshotting,
    # so the budget covers wait + tests.
    timeout-minutes: 30
    needs: [deploy-ready]
    if: (needs.deploy-ready.result == 'success' || needs.deploy-ready.result == 'skipped') && (github.event_name == 'pull_request' || github.ref == 'refs/heads/staging' || github.ref == 'refs/heads/main')
    env:
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # On PRs, test the PR's own build (not the deployed staging site).
      - name: Generate guide artifacts (PR local run)
        if: github.event_name == 'pull_request'
        run: npm run guide:user:sync && npm run guide:internal:sync

      - name: Build PR branch for local E2E
        if: github.event_name == 'pull_request'
        env:
          MOBILE_ELITE_GATE_STRICT: '0'
        run: npm run build

      - name: Start app for local E2E
        if: github.event_name == 'pull_request'
        uses: ./.github/actions/start-local-app

      - name: Run auth UX guard suite
        run: npm run test:e2e:auth-ux
        env:
          PLAYWRIGHT_BASE_URL: ${{ github.event_name == 'pull_request' && 'http://127.0.0.1:3000' || (github.ref == 'refs/heads/staging' && 'https://starting-monday-staging.up.railway.app' || secrets.PLAYWRIGHT_BASE_URL) }}

      - name: Stop local app
        if: always() && github.event_name == 'pull_request'
        uses: ./.github/actions/stop-local-app

      - name: Upload auth UX artifacts
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: auth-ux-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  accessibility-tier0:
    name: Tier-0 accessibility gate
    runs-on: ubuntu-latest
    container: mcr.microsoft.com/playwright:v1.62.1-noble
    timeout-minutes: 30
    needs: [deploy-ready]
    if: (needs.deploy-ready.result == 'success' || needs.deploy-ready.result == 'skipped') && (github.event_name == 'pull_request' || github.ref == 'refs/heads/staging' || github.ref == 'refs/heads/main')
    env:
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build PR branch for local accessibility run
        if: github.event_name == 'pull_request'
        env:
          NEXT_PUBLIC_SM_HERO_EVIDENCE_ENABLED: '1'
        run: npm run build

      - name: Start local app for PR accessibility run
        if: github.event_name == 'pull_request'
        uses: ./.github/actions/start-local-app
        env:
          NEXT_PUBLIC_SM_HERO_EVIDENCE_ENABLED: '1'

      - name: Run tier-0 accessibility suite
        run: npx playwright test tests/e2e/accessibility-tier0.spec.ts --project=accessibility-tier0
        env:
          NEXT_PUBLIC_SM_HERO_EVIDENCE_ENABLED: ${{ github.event_name == 'pull_request' && '1' || vars.NEXT_PUBLIC_SM_HERO_EVIDENCE_ENABLED }}
          PLAYWRIGHT_BASE_URL: ${{ github.event_name == 'pull_request' && 'http://127.0.0.1:3000' || (github.ref == 'refs/heads/staging' && 'https://starting-monday-staging.up.railway.app' || secrets.PLAYWRIGHT_BASE_URL) }}

      - name: Stop local app
        if: always() && github.event_name == 'pull_request'
        uses: ./.github/actions/stop-local-app

      - name: Upload accessibility artifacts
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: accessibility-tier0-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  lighthouse-mobile-budgets:
    name: Lighthouse mobile budgets
    runs-on: ubuntu-latest
    timeout-minutes: 35
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/staging' || github.ref == 'refs/heads/main'
    permissions:
      actions: read
      contents: read

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate guide artifacts
        run: npm run guide:user:sync && npm run guide:internal:sync

      - name: Build app
        run: npm run build

      - name: Determine Lighthouse budget profile
        id: lighthouse_profile
        uses: actions/github-script@v8
        with:
          script: |
            const isMainPush = context.ref === 'refs/heads/main' && context.eventName === 'push'
            const defaultConfig = '.lighthouserc.json'
            const defaultProfile = 'baseline-950'

            if (!isMainPush) {
              core.setOutput('config', defaultConfig)
              core.setOutput('profile', defaultProfile)
              core.setOutput('streak', '0')
              core.notice(`Using ${defaultProfile} for non-main-push run`)
              return
            }

            const response = await github.rest.actions.listWorkflowRuns({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'ci.yml',
              status: 'completed',
              branch: 'main',
              event: 'push',
              per_page: 10,
              exclude_pull_requests: true,
            })

            const priorRuns = (response.data.workflow_runs ?? []).filter(
              (run) => run.id !== context.runId
            )

            let streak = 0
            for (const run of priorRuns) {
              if (run.conclusion === 'success') {
                streak += 1
              } else {
                break
              }
            }

            let config = defaultConfig
            let profile = defaultProfile

            if (streak >= 6) {
              config = '.lighthouserc.tight-800.json'
              profile = 'tight-800'
            } else if (streak >= 3) {
              config = '.lighthouserc.tight-850.json'
              profile = 'tight-850'
            }

            core.setOutput('config', config)
            core.setOutput('profile', profile)
            core.setOutput('streak', String(streak))
            core.notice(`Using ${profile} (${config}) with prior main success streak=${streak}`)

      - name: Run Lighthouse CI mobile budgets (pass 1)
        id: lighthouse_pass_1
        continue-on-error: true
        run: npx lhci autorun --config=${{ steps.lighthouse_profile.outputs.config }}

      - name: Run Lighthouse CI mobile budgets (pass 2 retry)
        id: lighthouse_pass_2
        if: steps.lighthouse_pass_1.outcome == 'failure'
        continue-on-error: true
        run: npx lhci autorun --config=${{ steps.lighthouse_profile.outputs.config }}

      # On PRs this gate is advisory: lab perf on shared runners is too noisy
      # to block merges. Absolute budgets are enforced on main pushes where the
      # streak-based profile tightening applies.
      - name: Enforce Lighthouse gate after retry (main/staging push only)
        if: steps.lighthouse_pass_1.outcome == 'failure' && steps.lighthouse_pass_2.outcome == 'failure' && github.event_name != 'pull_request'
        run: |
          echo "Lighthouse budgets failed on both pass 1 and pass 2."
          exit 1

      - name: Advisory Lighthouse summary (PR)
        if: steps.lighthouse_pass_1.outcome == 'failure' && steps.lighthouse_pass_2.outcome == 'failure' && github.event_name == 'pull_request'
        run: |
          echo "::warning::Lighthouse mobile budgets failed on this PR (advisory). Review the lighthouse-mobile-report artifact before merging."
          {
            echo "## Lighthouse mobile budgets (advisory on PR)"
            echo ""
            echo "Both passes failed the budget profile. This does not block merge,"
            echo "but the same budgets ARE enforced on main. Review the artifact."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Notify Slack on Lighthouse failure
        if: failure() && github.ref == 'refs/heads/main' && github.event_name == 'push'
        env:
          SLACK_UI_ALERTS_WEBHOOK: ${{ secrets.SLACK_UI_ALERTS_WEBHOOK }}
          LIGHTHOUSE_PROFILE: ${{ steps.lighthouse_profile.outputs.profile }}
          GREEN_STREAK: ${{ steps.lighthouse_profile.outputs.streak }}
        run: |
          if [ -z "$SLACK_UI_ALERTS_WEBHOOK" ]; then
            echo "SLACK_UI_ALERTS_WEBHOOK is not set; skipping Slack notification."
            exit 0
          fi

          RUN_URL="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          BRANCH="${GITHUB_REF_NAME}"
          REPO="${{ github.repository }}"
          EVENT="${{ github.event_name }}"

          payload=$(cat <<'JSON'
          {
            "text": "[CRIT] Lighthouse mobile budgets failed\nRepo: REPO_PLACEHOLDER\nBranch: BRANCH_PLACEHOLDER\nEvent: EVENT_PLACEHOLDER\nRun: RUN_URL_PLACEHOLDER\nBudget profile: PROFILE_PLACEHOLDER\nPrior main green streak: STREAK_PLACEHOLDER\nNext action: Review Lighthouse artifact and fix failing budget(s)."
          }
          JSON
          )

          payload="${payload//REPO_PLACEHOLDER/$REPO}"
          payload="${payload//BRANCH_PLACEHOLDER/$BRANCH}"
          payload="${payload//EVENT_PLACEHOLDER/$EVENT}"
          payload="${payload//RUN_URL_PLACEHOLDER/$RUN_URL}"
          payload="${payload//PROFILE_PLACEHOLDER/$LIGHTHOUSE_PROFILE}"
          payload="${payload//STREAK_PLACEHOLDER/$GREEN_STREAK}"

          curl --fail-with-body -sS -X POST -H 'Content-type: application/json' --data "$payload" "$SLACK_UI_ALERTS_WEBHOOK"

      - name: Upload Lighthouse artifacts
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: lighthouse-mobile-report
          path: .lighthouseci/
          retention-days: 7

  pre-prod-gate:
    name: Pre-production synthetic gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Only gate on main/staging pushes that will trigger a deploy.
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/staging'
    needs: [predeploy-gates, first-value-synthetic-gate]
    permissions:
      actions: read
      contents: read

    steps:
      - name: Check production synthetic pass rate (last 3 runs)
        id: gate
        uses: actions/github-script@v8
        with:
          script: |
            // Require the last 3 production-synthetics runs to have all passed.
            // This ensures we are not deploying into an already-degraded production.
            const res = await github.rest.actions.listWorkflowRuns({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'production-synthetics.yml',
              status: 'completed',
              per_page: 3,
              branch: 'main',
              exclude_pull_requests: true,
            })

            const runs = res.data.workflow_runs ?? []
            if (runs.length === 0) {
              core.notice('No completed production-synthetics runs found — gate is advisory, allowing deploy')
              core.setOutput('gate_pass', 'true')
              return
            }

            const failures = runs.filter(r => r.conclusion === 'failure')
            const summary = runs.map(r => `${r.conclusion}(${r.id})`).join(', ')
            core.notice(`Production synthetics last 3 runs: ${summary}`)

            if (failures.length > 0) {
              const msg = `Pre-prod gate BLOCKED: ${failures.length}/${runs.length} production synthetic runs are failing. ` +
                `Resolve synthetic failures before deploying. Runs: ${summary}`
              core.setOutput('gate_pass', 'false')
              core.setOutput('summary', msg)
              core.setFailed(msg)
            } else {
              core.setOutput('gate_pass', 'true')
              core.notice('Pre-prod gate PASSED: all recent production synthetics are green')
            }

  semgrep:
    name: Semgrep security scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # High-severity findings block; the full scan remains advisory.
    # Skip dependabot to avoid noise
    if: github.actor != 'dependabot[bot]'

    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install Semgrep CLI
        run: python3 -m pip install --upgrade semgrep

      - name: Run Semgrep high-severity (blocking)
        run: semgrep scan --config .semgrep.yml --severity ERROR --error --quiet

      - name: Run Semgrep full scan (advisory)
        continue-on-error: true
        run: semgrep scan --config .semgrep.yml --quiet

      - name: Upload Semgrep findings to Semgrep Cloud (optional)
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/staging'
        continue-on-error: true
        env:
          SEMGREP_APP_TOKEN: ${{ secrets.SEMGREP_APP_TOKEN }}
        run: |
          if [ -z "${SEMGREP_APP_TOKEN:-}" ]; then
            echo "SEMGREP_APP_TOKEN not set in runner environment; skipping Semgrep Cloud upload."
            exit 0
          fi

          python3 -m pip install --upgrade semgrep
          semgrep ci --config auto

  secret-scan:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.actor != 'dependabot[bot]'
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  dependency-audit:
    name: Dependency vulnerability audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'

      - name: Audit production dependencies (high/critical)
        run: npm audit --omit=dev --audit-level=high

  notify-failure:
    name: Notify Slack on failure
    runs-on: ubuntu-latest
    needs: [deploy-ready, predeploy-gates, semgrep, playwright, mobile-visual-smoke, auth-ux-guard, accessibility-tier0, lighthouse-mobile-budgets, pre-prod-gate]
    if: failure() && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/staging')

    steps:
      - name: Determine failed job
        id: failed-job
        run: |
          if [[ "${{ needs.deploy-ready.result }}" == "failure" ]]; then
            echo "job_name=Wait for deployment of this commit" >> $GITHUB_OUTPUT
            echo "job_link=${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" >> $GITHUB_OUTPUT
          elif [[ "${{ needs.predeploy-gates.result }}" == "failure" ]]; then
            echo "job_name=Predeploy gates (lint, typecheck, build, smoke)" >> $GITHUB_OUTPUT
            echo "job_link=${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" >> $GITHUB_OUTPUT
          elif [[ "${{ needs.pre-prod-gate.result }}" == "failure" ]]; then
            echo "job_name=Pre-production synthetic gate" >> $GITHUB_OUTPUT
            echo "job_link=${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" >> $GITHUB_OUTPUT
          elif [[ "${{ needs.semgrep.result }}" == "failure" ]]; then
            echo "job_name=Semgrep security scan" >> $GITHUB_OUTPUT
            echo "job_link=${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" >> $GITHUB_OUTPUT
          elif [[ "${{ needs.playwright.result }}" == "failure" ]]; then
            echo "job_name=Playwright E2E" >> $GITHUB_OUTPUT
            echo "job_link=${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" >> $GITHUB_OUTPUT
          elif [[ "${{ needs.mobile-visual-smoke.result }}" == "failure" ]]; then
            echo "job_name=Mobile visual smoke" >> $GITHUB_OUTPUT
            echo "job_link=${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" >> $GITHUB_OUTPUT
          elif [[ "${{ needs.auth-ux-guard.result }}" == "failure" ]]; then
            echo "job_name=Auth UX guard" >> $GITHUB_OUTPUT
          elif [[ "${{ needs.accessibility-tier0.result }}" == "failure" ]]; then
            echo "job_name=Tier-0 accessibility gate" >> $GITHUB_OUTPUT
            echo "job_link=${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" >> $GITHUB_OUTPUT
          elif [[ "${{ needs.lighthouse-mobile-budgets.result }}" == "failure" ]]; then
            echo "job_name=Lighthouse mobile budgets" >> $GITHUB_OUTPUT
            echo "job_link=${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" >> $GITHUB_OUTPUT
          fi

      - name: Send Slack notification
        uses: slackapi/slack-github-action@v1.24.0
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        with:
          payload: |
            {
              "text": "❌ CI Build Failed",
              "blocks": [
                {
                  "type": "header",
                  "text": {
                    "type": "plain_text",
                    "text": "❌ CI Build Failed"
                  }
                },
                {
                  "type": "section",
                  "fields": [
                    {
                      "type": "mrkdwn",
                      "text": "*Branch:*\n`${{ github.ref_name }}`"
                    },
                    {
                      "type": "mrkdwn",
                      "text": "*Author:*\n${{ github.actor }}"
                    },
                    {
                      "type": "mrkdwn",
                      "text": "*Failed Job:*\n${{ steps.failed-job.outputs.job_name }}"
                    },
                    {
                      "type": "mrkdwn",
                      "text": "*Commit:*\n<${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}|${{ github.sha }}>"
                    }
                  ]
                },
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "<${{ steps.failed-job.outputs.job_link }}|View full build logs →>"
                  }
                }
              ]
            }

  notify-test-summary:
    name: Post test summary report
    runs-on: ubuntu-latest
    needs: [deploy-ready, predeploy-gates, semgrep, playwright, mobile-visual-smoke, auth-ux-guard, accessibility-tier0, lighthouse-mobile-budgets, pre-prod-gate]
    if: always()

    steps:
      - name: Build summary message
        id: summary
        run: |
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          DEPLOY_READY="${{ needs.deploy-ready.result }}"
          PREDEPLOY="${{ needs.predeploy-gates.result }}"
          SEMGREP="${{ needs.semgrep.result }}"
          PLAYWRIGHT="${{ needs.playwright.result }}"
          MOBILE_VISUAL="${{ needs.mobile-visual-smoke.result }}"
          AUTH_UX="${{ needs.auth-ux-guard.result }}"
          ACCESSIBILITY="${{ needs.accessibility-tier0.result }}"
          LIGHTHOUSE="${{ needs.lighthouse-mobile-budgets.result }}"
          PREPROD="${{ needs.pre-prod-gate.result }}"

          STATUS="PASS"
          if [ "$DEPLOY_READY" = "failure" ] || [ "$PREDEPLOY" = "failure" ] || [ "$SEMGREP" = "failure" ] || [ "$PLAYWRIGHT" = "failure" ] || [ "$MOBILE_VISUAL" = "failure" ] || [ "$AUTH_UX" = "failure" ] || [ "$ACCESSIBILITY" = "failure" ] || [ "$LIGHTHOUSE" = "failure" ] || [ "$PREPROD" = "failure" ]; then
            STATUS="FAIL"
          fi

          SUMMARY=$(printf 'CI test summary (%s)\nBranch: %s\nActor: %s\ndeploy-ready: %s\npredeploy-gates: %s\nsemgrep: %s\nplaywright: %s\nmobile-visual-smoke: %s\nauth-ux-guard: %s\naccessibility-tier0: %s\nlighthouse-mobile-budgets: %s\npre-prod-gate: %s\nRun: %s\n' "$STATUS" "${{ github.ref_name }}" "${{ github.actor }}" "$DEPLOY_READY" "$PREDEPLOY" "$SEMGREP" "$PLAYWRIGHT" "$MOBILE_VISUAL" "$AUTH_UX" "$ACCESSIBILITY" "$LIGHTHOUSE" "$PREPROD" "$RUN_URL")

          echo "status=$STATUS" >> "$GITHUB_OUTPUT"
          echo "summary<<EOF" >> "$GITHUB_OUTPUT"
          echo "$SUMMARY" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: Evaluate email noise-control policy
        id: email-policy
        if: always()
        uses: actions/github-script@v8
        env:
          CURRENT_STATUS: ${{ steps.summary.outputs.status }}
          FAILURE_STREAK_THRESHOLD: ${{ vars.CI_FAILURE_EMAIL_STREAK_THRESHOLD }}
        with:
          script: |
            const currentStatus = (process.env.CURRENT_STATUS || '').trim().toUpperCase()
            const rawThreshold = Number(process.env.FAILURE_STREAK_THRESHOLD || '3')
            const threshold = Number.isFinite(rawThreshold) && rawThreshold >= 1 ? Math.floor(rawThreshold) : 3

            // Only gate failure notifications. Pass summaries keep existing behavior.
            if (currentStatus !== 'FAIL') {
              core.setOutput('send_email', 'false')
              core.setOutput('failure_streak', '0')
              core.setOutput('threshold', String(threshold))
              core.setOutput('reason', 'Current status is PASS; failure streak policy not applicable')
              return
            }

            const branch = context.ref.replace('refs/heads/', '')
            // Single page is sufficient: the streak loop stops at the first
            // non-failure run. A transient GitHub API error must not fail CI,
            // so fall back to a conservative streak of 1 (email suppressed
            // unless threshold is 1).
            let runs = []
            try {
              const response = await github.rest.actions.listWorkflowRuns({
                owner: context.repo.owner,
                repo: context.repo.repo,
                workflow_id: 'ci.yml',
                branch,
                status: 'completed',
                per_page: 50,
                exclude_pull_requests: true,
              })
              runs = response.data.workflow_runs
            } catch (error) {
              core.warning(`Failed to list workflow runs for streak policy: ${error.message}`)
              core.setOutput('send_email', 'false')
              core.setOutput('failure_streak', '1')
              core.setOutput('threshold', String(threshold))
              core.setOutput('reason', 'GitHub API error while computing failure streak; suppressing email')
              return
            }

            let priorFailures = 0
            for (const run of runs) {
              if (run.id === context.runId) continue

              if (run.conclusion === 'failure') {
                priorFailures += 1
                continue
              }

              // Stop at first non-failure run; streak is consecutive failures only.
              break
            }

            const failureStreak = priorFailures + 1
            const sendEmail = failureStreak >= threshold && (failureStreak === threshold || failureStreak % threshold === 0)

            core.setOutput('send_email', sendEmail ? 'true' : 'false')
            core.setOutput('failure_streak', String(failureStreak))
            core.setOutput('threshold', String(threshold))
            core.setOutput(
              'reason',
              sendEmail
                ? `Sending failure summary at streak ${failureStreak} (threshold ${threshold})`
                : `Suppressing failure summary at streak ${failureStreak}; threshold ${threshold}`
            )

      - name: Log email policy decision
        if: always()
        run: |
          echo "Email policy decision: ${{ steps.email-policy.outputs.reason }}"
          echo "failure_streak=${{ steps.email-policy.outputs.failure_streak }} threshold=${{ steps.email-policy.outputs.threshold }}"

      - name: Post Slack summary
        if: always()
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          SUMMARY_TEXT: ${{ steps.summary.outputs.summary }}
        run: |
          if [ -z "$SLACK_WEBHOOK_URL" ]; then
            echo "SLACK_WEBHOOK_URL not configured; skipping Slack summary"
            exit 0
          fi

          payload=$(jq -n --arg text "$SUMMARY_TEXT" '{text:$text}')
          curl -sS -X POST -H 'Content-type: application/json' --data "$payload" "$SLACK_WEBHOOK_URL"

      - name: Send email summary
        if: always() && (steps.summary.outputs.status == 'PASS' || steps.email-policy.outputs.send_email == 'true')
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          RESEND_FROM_ADDRESS: ${{ secrets.RESEND_FROM_ADDRESS }}
          WEEKLY_AUDIT_EMAIL_TO: ${{ secrets.WEEKLY_AUDIT_EMAIL_TO }}
          SUMMARY_TEXT: ${{ steps.summary.outputs.summary }}
        run: |
          if [ -z "$RESEND_API_KEY" ]; then
            echo "RESEND_API_KEY not configured; skipping email summary"
            exit 0
          fi

          FROM=${RESEND_FROM_ADDRESS:-briefing@startingmonday.app}
          TO=${WEEKLY_AUDIT_EMAIL_TO:-richard@startingmonday.app}
          DATE=$(date -u +"%Y-%m-%d")

          payload=$(jq -n \
            --arg from "$FROM" \
            --arg to "$TO" \
            --arg subject "Starting Monday CI Test Summary - $DATE" \
            --arg text "$SUMMARY_TEXT" \
            '{from:$from,to:[$to],subject:$subject,text:$text}')

          curl -sS -X POST "https://api.resend.com/emails" \
            -H "Authorization: Bearer $RESEND_API_KEY" \
            -H "Content-Type: application/json" \
            -d "$payload"
