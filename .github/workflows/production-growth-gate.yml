name: Production Growth Gate

# Runs on main only. The PR-time copy of this gate was removed: its
# release-note staleness check measures elapsed calendar time rather than
# anything in the diff, so it failed every pull request regardless of content
# and trained people to ignore a red build.
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  growth-production-gate:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Growth synthetic council strict gate
        run: npm run growth:council:strict

      - name: Refresh growth metrics from PostHog
        env:
          POSTHOG_PROJECT_ID: ${{ secrets.POSTHOG_PROJECT_ID }}
          POSTHOG_PERSONAL_API_KEY: ${{ secrets.POSTHOG_PERSONAL_API_KEY }}
        run: npm run growth:metrics:export:strict

      - name: Growth strict metrics gate
        run: npm run growth:metrics:strict

      - name: Sitewide release-note artifact check
        run: npm run release:sitewide-note:strict

      - name: Generate guide artifacts
        run: npm run guide:user:sync && npm run guide:internal:sync

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build
