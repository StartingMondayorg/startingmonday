name: Apply simplification migrations (186, 187)

# Applies the two additive migrations shipped by the 2026-10-21 simplification PRs
# (#539 weekly_summary_opt_in, #542 interview_preps) to the production Supabase
# project through the management API, then verifies the schema. Same pattern as
# apply-monitoring-alert-state-migration.yml. Both migrations are idempotent
# (`if not exists`), so re-running is safe.

on:
  workflow_dispatch:
    inputs:
      migrations:
        description: Comma-separated migration files under supabase/migrations to apply, in order.
        required: true
        default: 186_weekly_summary_opt_in.sql,187_interview_preps.sql

permissions:
  contents: read

concurrency:
  group: production-simplification-migrations
  cancel-in-progress: false

jobs:
  apply-and-verify:
    name: Apply and verify
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v5

      - name: Apply migrations
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          MIGRATIONS: ${{ inputs.migrations }}
        run: |
          set -euo pipefail

          if [[ -z "${SUPABASE_ACCESS_TOKEN:-}" ]]; then
            echo "SUPABASE_ACCESS_TOKEN is not configured."
            exit 1
          fi

          sql=""
          IFS=',' read -ra files <<< "$MIGRATIONS"
          for f in "${files[@]}"; do
            f="$(echo "$f" | xargs)"
            case "$f" in
              */*|*..*) echo "Refusing path-like migration name: $f"; exit 1 ;;
            esac
            path="supabase/migrations/$f"
            if [[ ! -f "$path" ]]; then
              echo "Migration not found: $path"
              exit 1
            fi
            echo "Applying $path"
            sql="${sql}$(cat "$path")"$'\n'
          done

          jq -n --arg query "$sql" '{query: $query}' > migration-request.json

          http_status="$(curl --silent --show-error \
            --output migration-response.json \
            --write-out '%{http_code}' \
            --request POST \
            --header "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}" \
            --header 'Content-Type: application/json' \
            --data @migration-request.json \
            'https://api.supabase.com/v1/projects/mytnhoxcgvnzxhgcumkf/database/query')"

          if [[ "$http_status" -lt 200 || "$http_status" -ge 300 ]]; then
            echo "Migration API returned HTTP ${http_status}."
            jq -c '{message, error, code}' migration-response.json 2>/dev/null || true
            exit 1
          fi
          echo "Migration API returned HTTP ${http_status}."

      - name: Verify schema and RLS
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -euo pipefail

          read -r -d '' verify_sql <<'SQL' || true
          select
            (
              select count(*) = 1
              from information_schema.columns
              where table_schema = 'public'
                and table_name = 'user_profiles'
                and column_name = 'weekly_summary_opt_in'
                and data_type = 'boolean'
                and column_default = 'false'
            ) as weekly_summary_opt_in_column,
            to_regclass('public.interview_preps')::text as interview_preps_table,
            to_regclass('public.interview_preps_user_updated_idx')::text as interview_preps_index,
            (
              select c.relrowsecurity
              from pg_class c
              join pg_namespace n on n.oid = c.relnamespace
              where n.nspname = 'public' and c.relname = 'interview_preps'
            ) as interview_preps_rls,
            (
              select count(*)
              from pg_policies
              where schemaname = 'public' and tablename = 'interview_preps'
            ) as interview_preps_policy_count,
            to_regprocedure('public.set_interview_preps_updated_at()')::text as interview_preps_trigger_fn;
          SQL

          jq -n --arg query "$verify_sql" '{query: $query}' > verify-request.json
          http_status="$(curl --silent --show-error \
            --output verify-response.json \
            --write-out '%{http_code}' \
            --request POST \
            --header "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}" \
            --header 'Content-Type: application/json' \
            --data @verify-request.json \
            'https://api.supabase.com/v1/projects/mytnhoxcgvnzxhgcumkf/database/query')"

          if [[ "$http_status" -lt 200 || "$http_status" -ge 300 ]]; then
            echo "Verification API returned HTTP ${http_status}."
            jq -c '{message, error, code}' verify-response.json 2>/dev/null || true
            exit 1
          fi

          cat verify-response.json
          row="$(jq -c '.[0]' verify-response.json)"
          ok="$(jq -r '.weekly_summary_opt_in_column == true
                      and .interview_preps_table == "interview_preps"
                      and .interview_preps_index == "interview_preps_user_updated_idx"
                      and .interview_preps_rls == true
                      and (.interview_preps_policy_count | tonumber) == 4
                      and .interview_preps_trigger_fn != null' <<< "$row")"
          if [[ "$ok" != "true" ]]; then
            echo "Verification failed."
            exit 1
          fi
          echo "Verification passed."
